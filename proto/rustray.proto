// proto/xray.proto
syntax = "proto3";

package rustray.core.app.proxyman.command;

service HandlerService {
  rpc AddInbound (AddInboundRequest) returns (AddInboundResponse) {}
  rpc RemoveInbound (RemoveInboundRequest) returns (RemoveInboundResponse) {}
  rpc AlterInbound (AlterInboundRequest) returns (AlterInboundResponse) {}
}

message AddInboundRequest { InboundHandlerConfig inbound = 1; }
message AddInboundResponse {}
message RemoveInboundRequest { string tag = 1; }
message RemoveInboundResponse {}
message AlterInboundRequest { string tag = 1; TypedMessage operation = 2; }
message AlterInboundResponse {}

message InboundHandlerConfig {
  string tag = 1;
  TypedMessage receiver_settings = 2;
  TypedMessage proxy_settings = 3;
}

message TypedMessage { string type = 1; bytes value = 2; }

service StatsService {
  rpc GetStats (GetStatsRequest) returns (GetStatsResponse) {}
  rpc QueryStats (QueryStatsRequest) returns (QueryStatsResponse) {}
}

service ControlService {
  rpc SubscribeConfig (stream SubscribeConfigRequest) returns (stream ConfigEvent) {}
  rpc PushTelemetry (TelemetryReport) returns (TelemetryResponse) {}
}

message TelemetryReport {
  string node_id = 1;
  repeated UserTraffic traffic = 2;
  SystemStats system = 3;
}

message UserTraffic {
  string inbound_tag = 1;
  string email = 2;
  uint64 up = 3;
  uint64 down = 4;
}

message SystemStats {
  float cpu = 1;
  float mem = 2;
}

message TelemetryResponse {
  bool success = 1;
}

message SubscribeConfigRequest {
  string node_id = 1;
}

message ConfigEvent {
  string json_delta = 1;
  string config_hash = 2;
}

message GetStatsRequest { string name = 1; bool reset = 2; }
message GetStatsResponse { Stat stat = 1; }
message QueryStatsRequest { string pattern = 1; bool reset = 2; }
message QueryStatsResponse { repeated Stat stat = 1; }
message Stat { string name = 1; int64 value = 2; }
